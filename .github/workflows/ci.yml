name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check test nativeCompile
      - run: sudo apt-get update && sudo apt-get install -y wrk
      - run: bash scripts/benchmark.sh
      - name: Build container and check image size
        run: |
          docker build --tag kurl:ci .
          size=$(docker image inspect kurl:ci --format '{{.Size}}')
          user=$(docker image inspect kurl:ci --format '{{.Config.User}}')
          echo "Container image size: ${size} bytes"
          echo "Container user: ${user}"
          echo "- Distroless image virtual size: ${size} bytes" >> build/benchmark-results.md
          test "$size" -lt 60000000
          test "$user" = "65532:65532" -o "$user" = "nonroot:nonroot"
      - name: Smoke test the container
        run: |
          mkdir -p build/docker-data
          chmod 777 build/docker-data
          docker run -d --name kurl-ci -p 18081:8080 \
            -v "$PWD/build/docker-data:/app/data" kurl:ci
          for _ in $(seq 1 30); do
            health=$(docker inspect kurl-ci --format '{{.State.Health.Status}}')
            if [ "$health" = healthy ]; then break; fi
            sleep 1
          done
          test "$health" = healthy
          curl --fail http://127.0.0.1:18081/health
          docker stop --time 10 kurl-ci
          exit_code=$(docker inspect kurl-ci --format '{{.State.ExitCode}}')
          echo "Container exit code after stop: ${exit_code}"
          test "$exit_code" -eq 0
          docker rm kurl-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-benchmark
          path: |
            build/benchmark-results.md
            build/benchmark-server.log
